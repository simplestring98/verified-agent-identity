name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Name'
        required: true
        default: 'Simplestring'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'Simplestring AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. Clean environment (PENTING)
      - name: Clean cache & identity
        run: |
          npm cache clean --force
          rm -rf ~/.openclaw

      # 4. Install ClawHub skill (FORCE)
      - name: Install ClawHub identity skill
        run: npx clawhub@latest install verified-agent-identity --force

      # 5. Install dependencies script
      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      # 6. Create Ethereum Identity
      - name: Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      # 7. Link Human → Agent (pakai input dynamic)
      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\": \"${{ github.event.inputs.agent_name }}\", \"description\": \"${{ github.event.inputs.agent_description }}\"}"
